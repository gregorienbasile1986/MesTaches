name: Build Mes Taches APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt -y install automake libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-33 build-tools;35.0.0 ndk;28.2.13676358"

      - name: Prepare SDK compatibility for Buildozer
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/tools/bin"

          ln -sf \
            "$ANDROID_SDK_ROOT/cmdline-tools/20.0/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "sdkmanager:"
          "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" --version

          echo "AIDL:"
          ls -l "$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl"

          echo "Android platform:"
          ls -ld "$ANDROID_SDK_ROOT/platforms/android-33"

          echo "Android NDK:"
          ls -ld "$ANDROID_SDK_ROOT/ndk/28.2.13676358"

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MesTaches-apk
          path: bin/*.apk