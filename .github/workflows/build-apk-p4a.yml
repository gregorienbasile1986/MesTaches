name: Build Mes Taches APK - p4a

on:
  workflow_dispatch:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libtool \
            libssl-dev \
            make \
            patch \
            pkg-config \
            unzip \
            wget \
            zip

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;28.2.13676358

      - name: Configure Android NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install python-for-android
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            git+https://github.com/kivy/python-for-android.git

      - name: Verify Android environment
        run: |
          echo "SDK:"
          ls -la "$ANDROID_HOME"

          echo "NDK:"
          ls -la "$ANDROID_HOME/ndk/28.2.13676358"

          echo "AIDL:"
          ls -l "$ANDROID_HOME/build-tools/35.0.0/aidl"

          echo "p4a:"
          p4a --version

      - name: Build APK
        run: |
          p4a apk \
            --private . \
            --package=com.mestaches \
            --name="Mes Taches" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --requirements=python3,kivy \
            --arch=arm64-v8a \
            --sdk-dir="$ANDROID_HOME" \
            --ndk-dir="$ANDROID_NDK_HOME" \
            --android-api=35 \
            --ndk-api=21 \
            --debug

      - name: Find APK
        run: |
          echo "APK files found:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MesTaches-apk-p4a
          path: "**/*.apk"